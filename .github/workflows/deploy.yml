name: Deploy

# bkz. docs/adr/0015-production-deployment-architecture.md, docs/runbook.md.
# release-please'in tam tag formatı ilk gerçek release'e kadar kesinleşmiyor
# (bkz. release-please-config.json — tek paket, "." kökünde) — iki olası
# formatı da (v*.*.* / arac-yazilim-v*.*.*) tetikleyici olarak eşliyoruz;
# ilk gerçek tag geldiğinde gerekirse bu liste daraltılmalı.
on:
  push:
    tags:
      - "v*.*.*"
      - "arac-yazilim-v*.*.*"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # checks.yml'i tekrar çalıştırmıyoruz — main.yml zaten her main push'unda
  # lint/typecheck/test'i garanti ediyor; tag'ler main'den (release-please PR
  # merge'i sonrası) kesiliyor, bu yüzden tag push'ta tekrar aynı kontrolleri
  # koşmak gereksiz gecikme. Yalnızca build+push+deploy burada.
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
          - service: diag-service
            context: apps/diag-service
            dockerfile: apps/diag-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR'a giriş yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: VPS'e SSH ile bağlan ve deploy et
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/arac-yazilim
            git fetch --tags
            git checkout "${{ github.ref_name }}"
            export IMAGE_TAG="${{ github.ref_name }}"
            ./scripts/deploy-remote.sh
