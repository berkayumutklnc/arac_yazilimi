name: Checks

# Yeniden kullanılabilir workflow — hem pr.yml hem main.yml bunu çağırır
# (bkz. plan: tek kaynaktan lint/typecheck/unit/python/prisma-validate).
#
# GEÇİCİ: `npm ci` yerine `npm install` kullanılıyor. package-lock.json
# Windows'ta üretildiği için ~30 native-binary optional dependency'nin
# (esbuild, sharp, rollup, lightningcss, @node-rs/argon2, @tailwindcss/oxide
# vb.) linux-x64 varyantları lockfile'da hiç yok — `npm ci` bu yüzden Linux
# runner'da MODULE_NOT_FOUND ile patlıyor (CI'ın branch uyuşmazlığı yüzünden
# hiç tetiklenmediği dönemde fark edilmemiş, kalıcı bir sorun). Kalıcı çözüm:
# package-lock.json'ı Linux/WSL'de (ya da CI'ın kendisinde) `rm -rf
# node_modules package-lock.json && npm install` ile yeniden üretip commit'lemek
# — o zaman `npm ci`'ya geri dönülmeli (lockfile-sıkı reproducibility için).
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    # Prisma client + diag-service OpenAPI tipleri gitignore'lu (bkz.
    # apps/api/.gitignore, packages/shared) — üretilmeden lint/typecheck/test
    # bu dosyalara import atan her yerde "Cannot find module" ile patlar
    # (canlı Postgres+MinIO doğrulaması sonrası CI'ın gerçekten ilk kez
    # tetiklendiği çalıştırmada tespit edildi — daha önce hiç koşmamıştı).
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install
      - run: npm run generate:diag-types -w @arac-yazilim/shared
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install
      - run: npm run generate:diag-types -w @arac-yazilim/shared
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install
      - run: npm run generate:diag-types -w @arac-yazilim/shared
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
      - run: npm run test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diag-service dependencies
        working-directory: apps/diag-service
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: apps/diag-service
        run: pytest

  prisma-validate:
    runs-on: ubuntu-latest
    # Gerçek bir bağlantı gerekmez — `prisma validate` yalnızca DATABASE_URL'in
    # OKUNABİLİR olmasını ister (doğrulandı, bkz. docs/local-postgres-setup.md).
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install
      - name: prisma validate
        working-directory: apps/api
        run: npx prisma validate
