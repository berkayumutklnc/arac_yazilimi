name: Checks

# Yeniden kullanılabilir workflow — hem pr.yml hem main.yml bunu çağırır
# (bkz. plan: tek kaynaktan lint/typecheck/unit/python/prisma-validate).
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diag-service dependencies
        working-directory: apps/diag-service
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: apps/diag-service
        run: pytest

  prisma-validate:
    runs-on: ubuntu-latest
    # Gerçek bir bağlantı gerekmez — `prisma validate` yalnızca DATABASE_URL'in
    # OKUNABİLİR olmasını ister (doğrulandı, bkz. docs/local-postgres-setup.md).
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: prisma validate
        working-directory: apps/api
        run: npx prisma validate
